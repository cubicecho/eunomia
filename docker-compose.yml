services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      # Day boundaries on the dashboard follow this zone (e.g.
      # America/Chicago). Decide before data accrues — rolled-up summaries
      # keep the day they were bucketed into.
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgres://eunomia:eunomia@postgres:5432/eunomia
      # Days of raw activities to keep; summaries (and so the charts) are
      # kept forever. 0 keeps raw rows forever too.
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
      # No default on purpose — a shared secret is a forged session. Put a
      # real one in .env (openssl rand -base64 32) or the app won't start.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      PORT: "4000"
      # Where magic links point. Empty = same as BETTER_AUTH_URL, since this
      # container serves the web dashboard itself.
      APP_URL: ${APP_URL:-}
      # Who may hold an account here — see .env.example.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      # See .env.example — returns magic-link tokens to callers when true.
      UNSAFE_LOCAL_NETWORK: ${UNSAFE_LOCAL_NETWORK:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: eunomia
      POSTGRES_PASSWORD: eunomia
      POSTGRES_DB: eunomia
    ports:
      # Loopback-only publish so local dev/migrations can reach the database
      # without exposing it beyond the machine. Host port 5433 to stay clear
      # of any locally running postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eunomia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
