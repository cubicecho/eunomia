# Required repository secrets for Docker Hub publishing:
#   DOCKERHUB_USERNAME — your Docker Hub username
#   DOCKERHUB_TOKEN    — a Docker Hub access token (not your password)
# ghcr.io needs no secret of its own: GITHUB_TOKEN authenticates it.

name: Release

# Deliberately not `push: [main]`. A release publishes an image other machines
# will pull, so it waits on the CI run for that same commit to go green rather
# than racing it.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      # workflow_run checks out the default branch's tip, not the commit that
      # triggered CI. Name that commit explicitly, so the tag, the release notes
      # and the image all describe what was actually tested.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # The version comes from the commit messages. A run holding no
      # feat:/fix:/BREAKING CHANGE commit publishes nothing, and every step
      # below is skipped along with it.
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3

      # The context is the repo root rather than apps/server: the image installs
      # the whole npm workspace, because @eunomia/gql generates the resolver
      # types and the dashboard's SDK from the committed schema.graphql.
      - name: Build and push Docker image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.semantic.outputs.new_release_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/eunomia:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eunomia:${{ steps.semantic.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
