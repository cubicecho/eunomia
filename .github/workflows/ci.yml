name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run lint` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      # Server tests run Postgres in-process (PGlite), so there is no service
      # container here and there doesn't need to be one.
      - name: Test
        run: npm test

      # The printed SDL and the SDKs generated from it are committed — they're
      # the contract the agents and the dashboard build against. If they drift,
      # those consumers typecheck against a schema the server no longer has.
      # Schema printing touches neither database nor auth, so this needs no env.
      - name: Generated GraphQL contract is up to date
        run: |
          npm run codegen
          git diff --exit-code -- schema.graphql packages/agent/src/gql apps/web/src/gql

      # The desktop agent ships as a bundle, not as the sources tsc checked:
      # esbuild resolves imports tsc is happy to leave dangling.
      - name: Bundle the desktop agent
        run: |
          npm run build:main -w @eunomia/desktop
          npm run build:preload -w @eunomia/desktop

      - name: Build the dashboard
        run: npm run build -w @eunomia/web

      # The Android app config is only evaluated at build time, on EAS — a
      # broken plugin or a missing asset would otherwise surface twenty minutes
      # into a build instead of here. Resolving it needs no SDK and no network.
      - name: Android app config resolves
        run: npx expo config --type prebuild
        working-directory: apps/mobile

      # Test builds are allowed to talk to a plain-HTTP LAN server; release
      # builds are not. That second half is one typo away from regressing
      # silently, and the failure mode is an APK that ships cleartext — so
      # generate both manifests and read them.
      - name: Android release builds refuse cleartext
        run: |
          npx expo prebuild --platform android --no-install --clean
          if grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml; then
            echo '::error::the release manifest permits cleartext'
            exit 1
          fi
          EUNOMIA_ALLOW_CLEARTEXT=1 npx expo prebuild --platform android --no-install --clean
          grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml || {
            echo '::error::test builds lost their cleartext allowance'
            exit 1
          }
        working-directory: apps/mobile
