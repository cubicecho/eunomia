# The static operations agents perform. Codegen validates these against
# schema.graphql and emits the typed SDK in src/gql/sdk.ts.

# The upload path. One request, one server-side transaction: the whole batch
# lands or none of it does, so a retry after a timeout can never double-count
# folded time. The device comes from the API key.
mutation RecordPings($pings: [PingInput!]!) {
  recordPings(pings: $pings)
}

mutation RequestMagicLink($email: String!) {
  requestMagicLink(email: $email) {
    token
  }
}

mutation VerifyMagicLink($token: String!) {
  verifyMagicLink(token: $token) {
    token
  }
}

mutation RegisterDevice($name: String!, $platform: String!) {
  registerDevice(name: $name, platform: $platform) {
    device {
      id
    }
    apiKey
  }
}

mutation RotateDeviceKey($id: String!) {
  rotateDeviceKey(id: $id) {
    device {
      id
    }
    apiKey
  }
}

mutation RenameDevice($id: String!, $name: String!) {
  renameDevice(id: $id, name: $name) {
    id
    name
  }
}

mutation SignOut {
  signOut
}

mutation SessionFromDeviceKey {
  sessionFromDeviceKey {
    token
    userId
  }
}
