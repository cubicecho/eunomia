  """
  Pass as `cursor` with the next records; null once the import is complete.
  """
  next: String

  """Pings folded by this call."""
  pings: Int!

  """Send the file again from its first record, with `next` as the cursor."""
  restart: Boolean!

  """Records passed over; `warnings` says why."""
  skipped: Int!

  """Why records were skipped, one line per reason."""
  warnings: [String!]!
}

"""What `importChunk` reads."""
enum ImportSource {
  """
  ActivityWatch history: the client sends a `{"format":"activitywatch","afk":…}`
  header, then the events of the window, AFK and web buckets it read from
  aw-server's export as `{"type","timestamp","duration","data"}` records, sorted
  by timestamp across buckets. Folded as pings into the target device.
  """
  ACTIVITYWATCH

  """
  An account bundle from `accountExport(format: BUNDLE)`, one JSON line per
  record. Restores the time zone (unless the caller has one), categories and
  rules (matched to existing ones), and each device as a new device without
  keys; activities are rebuilt from the ping log, and summaries are kept only
  for days the log doesn't reach. Read twice — see `ImportChunk.restart`.
  """
  BUNDLE

  """
  A RescueTime Analytic Data export as CSV records, header first (Date, Time
  Spent, Activity and optionally Document columns). Added to the target device
  as daily totals — the file has no order within its intervals to rebuild
  activities from.
  """
  RESCUETIME
}

