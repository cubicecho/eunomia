"""What `accountExport` writes."""
enum ExportFormat {
  """
  The raw ping log as an ActivityWatch export (aw-server's `/api/0/export`
  JSON): an `aw-watcher-window_<device>` and an `aw-watcher-afk_<device>` bucket
  per device, importable from ActivityWatch's Import page.
  """
  ACTIVITYWATCH

  """
  Everything the account holds, as JSON Lines (`.jsonl`): a
  `{"format":"eunomia-export","version":1}` header, then one record per line
  tagged with `type` — profile, device, category, categoryRule, contextRule,
  mergeRule, summary, activity, focusSegment, ping — and a closing `end` record
  with the counts. Never includes API keys, sessions or other credentials.
  Always the whole account: takes no date range.
  """
  BUNDLE

  """Daily totals as CSV: `day,device,category,app,context,seconds`."""
  SUMMARIES_CSV
}

