# The half of the schema this server writes by hand: everything that isn't a
# read of a table. Types named here that aren't defined here (Activities,
# Devices, …) come from the generated half — drizzle-graphql derives them from
# the Drizzle schema, and this file is applied on top of it (schema.ts).
#
# This is the source of truth for the shape. codegen turns it into the argument
# and return types every resolver beside this file is checked against
# (src/gql/resolvers.ts), so a field that changes here without its resolver
# changing is a typecheck failure. Every field added here needs a rule in
# permissions.ts and a resolver in one of the *-fields.ts modules; both are
# checked, the first by the type of the permissions map and the second at
# schema assembly.

extend type Query {
  "The caller, or null when the request is anonymous."
  me: Me
  # How sign-in through an OIDC provider is set up. Public, so the sign-in page
  # can show the provider's button, and so a brand-new instance can offer to
  # set it up before anyone has an account.
  ssoSetup: SsoSetup!
  # True on a brand-new server waiting for the setup code it printed to its
  # log at boot (claimSetupCode). Public, for the sign-in page.
  setupCodePending: Boolean!

  """
  The caller's integration keys — the ones issued from the dashboard for other
  apps. Device agent keys are not listed here; they belong to their device.

  Never carries the key itself: only a hash is stored, and `start` is the few
  leading characters kept so two keys can be told apart.
  """
  apiKeys: [ApiKey!]!

  """
  The starter rule packs this server ships, and which of them the caller has
  installed (see `installRulePack`).
  """
  rulePacks: [RulePack!]!

  """
  Time per category per day — the answer to "what did I spend last week on?".

  Each aggregate below stitches the precomputed `summaries` rows together with
  a live aggregation over whatever the 15-minute rollup hasn't claimed yet, so
  today is never missing.
  """
  categorySummary(
    "Start of the window, inclusive. A calendar date, `YYYY-MM-DD`, read in the caller's time zone (`me.effectiveTimeZone`)."
    from: String!
    "End of the window, EXCLUSIVE — pass the day after the last one you want."
    to: String!
    "Limit to one device (see `devices`). Omitted means every device."
    deviceId: String
  ): [CategoryDaySummary!]!

  """
  Time per app and context over the window — the same seconds as
  `categorySummary`, grouped by what was actually on screen. Not per-day: one
  row per app/context/category triple for the whole window.
  """
  appSummary(
    "Start of the window, inclusive. A calendar date, `YYYY-MM-DD`, read in the caller's time zone (`me.effectiveTimeZone`)."
    from: String!
    "End of the window, EXCLUSIVE — pass the day after the last one you want."
    to: String!
    "Limit to one device (see `devices`). Omitted means every device."
    deviceId: String
  ): [AppContextSummary!]!

  """
  Time per device over the window — which machine or phone the time came from.
  """
  deviceSummary(
    "Start of the window, inclusive. A calendar date, `YYYY-MM-DD`, read in the caller's time zone (`me.effectiveTimeZone`)."
    from: String!
    "End of the window, EXCLUSIVE — pass the day after the last one you want."
    to: String!
  ): [DeviceSummary!]!

  # Agent-shaped reads: one call answers a question an assistant is likely to
  # be asked, where the dashboard's aggregates would take several and some
  # date arithmetic. Same rolled-plus-live seconds as the aggregates above.

  """
  One day at a glance: total active time, time per category, the biggest
  entries and time per device. `day` is `YYYY-MM-DD` in the caller's time zone;
  omitted means today there.
  """
  daySummary(
    day: String
    "How many of the biggest app/context entries to list. Default 10, at most 50."
    top: Int
  ): DaySummary!

  """
  The biggest uncategorized entries over the window, largest first: what to
  write rules for. Each row is an app, or one context inside it, as the review
  queue lists it. Pass one to `assignEntry`, or a pattern to
  `previewCategoryRule` first.
  """
  uncategorized(
    "Start, inclusive, `YYYY-MM-DD` in the caller's zone. Default: 7 days before `to`."
    from: String
    "End, EXCLUSIVE, `YYYY-MM-DD`. Default: tomorrow, so today is included."
    to: String
    "At most this many rows. Default 20, at most 100."
    limit: Int
  ): [AppContextSummary!]!

  """
  Stored activities whose app, context or window title contains `query`
  (case-insensitive), most recent first. Raw activities are kept for the
  retention period only, so older time is not searchable.
  """
  searchActivity(
    query: String!
    "Start, inclusive, `YYYY-MM-DD` in the caller's zone. Omitted: no lower bound."
    from: String
    "End, EXCLUSIVE, `YYYY-MM-DD`. Omitted: no upper bound."
    to: String
    "At most this many rows. Default 50, at most 200."
    limit: Int
  ): [ActivityMatch!]!

  """
  What a category rule with these patterns would match, without creating it:
  the dry run for `createCategoryRule`. Patterns are case-insensitive regular
  expressions, as in a rule; every given one must match. Only stored
  activities are checked (see `searchActivity`).
  """
  previewCategoryRule(
    appPattern: String
    titlePattern: String
    contextPattern: String
    "Start, inclusive, `YYYY-MM-DD`. Default: 30 days before `to`."
    from: String
    "End, EXCLUSIVE, `YYYY-MM-DD`. Default: tomorrow."
    to: String
  ): CategoryRulePreview!

  """
  The caller's data as a downloadable file, one chunk per call. Call it with no
  `cursor`, append `data`, and call again with the same arguments plus `cursor:
  next` until `next` is null; the concatenated `data` is the file.

  Not a snapshot: rows written between calls may or may not be included.
  Session-only — an API key can't export (see permissions.ts).
  """
  accountExport(
    format: ExportFormat!
    """
    First day to include, `YYYY-MM-DD` in the caller's time zone. Only for
    ACTIVITYWATCH and SUMMARIES_CSV; omitted means from the beginning.
    """
    from: String
    "Day after the last one to include (EXCLUSIVE). Omitted means up to now."
    to: String
    "The previous chunk's `next`. Omitted starts the file."
    cursor: String
  ): ExportChunk!
}

type Mutation {
  # Auth. The server mounts no better-auth REST routes: this is the login flow.
  signUp(email: String!, password: String!, name: String!): AuthSession!
  signIn(email: String!, password: String!): AuthSession!
  requestMagicLink(email: String!): MagicLinkRequest!
  verifyMagicLink(token: String!): AuthSession!
  signOut: Boolean!
  sessionFromDeviceKey: AuthSession!
  # The last leg of an OIDC sign-in: the one-time token the callback put on the
  # dashboard's URL (`/?sso=`), for a session. Single use, and only for a few
  # minutes; BAD_USER_INPUT once spent or expired. An agent that started the
  # sign-in with a `code_challenge` (to get the token back in the app rather
  # than the dashboard) must send the verifier behind it.
  verifyOneTimeToken(token: String!, codeVerifier: String): AuthSession!
  # Creates the first account on a brand-new server, with the setup code the
  # server printed to its log, and signs it in. No email is sent. FORBIDDEN
  # once any account exists; BAD_USER_INPUT for a wrong code.
  claimSetupCode(code: String!, email: String!): AuthSession!
  # A sign-in link for the caller's own address, returned rather than emailed:
  # paste it into an agent's setup screen to sign it in without SMTP. Expires
  # in 15 minutes, single use. Signed-in sessions only.
  deviceSignInLink: String!
  # Pairs the instance with the provider a setup URL names
  # (`<issuer>#setup=<token>&name=<name>`), registering eunomia there through
  # Dynamic Client Registration. The admin, or anyone while the instance has no
  # accounts. BAD_USER_INPUT or RATE_LIMITED with `extensions.reason` when the
  # provider would not pair; FORBIDDEN for anyone else, or when OIDC_ISSUER
  # names the provider; CONFLICT when one is paired already.
  pairSso(setupUrl: String!): SsoSetup!
  # Deletes eunomia's client at the paired provider and stops offering it.
  # Accounts stay. Same rule as pairSso.
  unpairSso: SsoSetup!

  # Account. The caller's time zone: an IANA name, or null to follow the
  # server's. Moves the days of every activity still kept onto the new zone's
  # midnight; older summaries stay where they were bucketed. Session-only (see
  # permissions.ts).
  setTimeZone(timeZone: String): Me!
  # Days of raw pings and activities to keep, fewer than the server keeps; null
  # follows the server. Applied at the next prune. Session-only.
  setRetention(days: Int): Me!
  # The dashboard's getting-started checklist: put it away (or bring it back),
  # and tick (or untick) the privacy-lists step, which the server has no way to
  # see done. An omitted argument leaves that flag as it is. Session-only.
  setOnboarding(dismissed: Boolean, privacyReviewed: Boolean): Me!

  # Deletion. Session-only (see permissions.ts); none of them can be undone.
  """
  Deletes everything recorded between `from` (inclusive) and `to` (exclusive),
  ISO timestamps, on one device or — with no `deviceId` — all of them. Pings
  from the range that are still on their way from an agent are dropped when
  they arrive. See `RangeDeletion.partialDays` for what can't be split.
  """
  deleteRange(from: String!, to: String!, deviceId: String): RangeDeletion!
  """
  Deletes an app — or, with `context`, one context of it — from every device:
  pings, activities, focus segments and summaries, as the dashboard names it
  (after context and merge rules). Doesn't stop it being recorded from now on.
  """
  purgeApp(app: String!, context: String): AppPurge!
  """
  Deletes the caller's account and everything in it, revoking every key. `email`
  must be the account's own, retyped. Export first: nothing is recoverable.
  """
  deleteAccount(email: String!): Boolean!

  # Devices. registerDevice and rotateDeviceKey are the only fields that ever
  # return an API key, and only at the moment it is minted.
  registerDevice(name: String!, platform: String!): DeviceRegistration!
  renameDevice(id: String!, name: String!): Devices!
  rotateDeviceKey(id: String!): DeviceRegistration!
  mergeDevice(id: String!, intoId: String!): Devices!
  # Rebuilds the device's activities and summaries from its raw ping log, from
  # the nearest seam at or before `from` (an ISO timestamp; omitted = the
  # whole log), under the current rules. Session-only (see permissions.ts).
  replayDevice(id: String!, from: String): DeviceReplay!
  deleteDevice(id: String!): Boolean!

  # Integration keys: what another app authenticates to this server with.
  # Session-only (see permissions.ts) — a key may not manage keys.
  # `scopes` adds what the key may do beyond reading; see ApiKeyScope.
  createApiKey(name: String!, expiresInDays: Int, scopes: [ApiKeyScope!]): ApiKeyIssued!
  renameApiKey(id: String!, name: String!): ApiKey!
  revokeApiKey(id: String!): Boolean!

  # Ingestion — the fields the agents call continuously.
  recordPing(
    deviceId: String
    capturedAt: String!
    app: String
    title: String
    context: String
    idleSeconds: Int!
  ): Activities
  recordPings(deviceId: String, pings: [PingInput!]!): Int!

  # Categories, and the two mutations that move time between them by hand.
  "`kind` defaults to neutral."
  createCategory(name: String!, color: String, kind: CategoriesKindEnum): Categories!
  """
  A whole replacement, like updateCategoryRule: a null color clears it, and a
  null or omitted kind makes the category neutral.
  """
  updateCategory(id: String!, name: String!, color: String, kind: CategoriesKindEnum): Categories!
  deleteCategory(id: String!): Boolean!
  assignActivity(activityId: String!, categoryId: String): Activities!
  """
  Assigns every uncategorized second of one entry — an app, or one context
  inside it — over a window, the way the review queue lists them (the
  `categoryId: null` rows of `appSummary`). Time already in a category, by
  hand or by rule, is left where it is.

  Rolled-up days move too, including ones whose raw activities have aged out.
  The activities that are still stored become manual assignments, so rules
  never move them back. Returns the seconds assigned.
  """
  assignEntry(
    app: String!
    "Null is the app's time with no context, not every context of the app."
    context: String
    categoryId: String!
    "Start of the window, inclusive. A calendar date, `YYYY-MM-DD`, read in the server's time zone."
    from: String!
    "End of the window, EXCLUSIVE — pass the day after the last one you want."
    to: String!
  ): Float!

  # Rules: what time is called, and how it is divided.
  createCategoryRule(
    categoryId: String!
    appPattern: String
    titlePattern: String
    contextPattern: String
    priority: Int
  ): CategoryRules!
  updateCategoryRule(
    id: String!
    categoryId: String!
    appPattern: String
    titlePattern: String
    contextPattern: String
    priority: Int
  ): CategoryRules!
  deleteCategoryRule(id: String!): Boolean!
  applyCategoryRules: Int!
  """
  Installs a starter rule pack: creates its category (or reuses the caller's
  category of that name) and writes its rules as ordinary category rules, then
  applies every rule to past activity like `applyCategoryRules`.

  Idempotent. Installing again never duplicates a rule: a rule already written
  by this version of the pack is left as it is, edits included, a rule an older
  version wrote is updated to this version's lists, and a pack rule that was
  deleted is written again.
  """
  installRulePack(id: String!): RulePackInstall!
  createContextRule(titlePattern: String!, appPattern: String, priority: Int): ContextRules!
  updateContextRule(
    id: String!
    titlePattern: String!
    appPattern: String
    priority: Int
  ): ContextRules!
  deleteContextRule(id: String!): Boolean!
  createMergeRule(
    fromApp: String!
    fromContext: String
    toApp: String!
    toContext: String
  ): MergeRules!
  deleteMergeRule(id: String!): Boolean!
  applyMergeRules: Int!

  """
  Imports history from a file into the caller's own account, a chunk of records
  per call — the mirror of `accountExport`. The client reads the file and sends
  its records in order: call with no `cursor` (and, for ACTIVITYWATCH and
  RESCUETIME, a `target`), then again with `cursor: next` and the next records,
  passing `done: true` with the last of them, until `next` is null.

  Each call is applied whole or not at all, so a failed call can be sent again
  with the same records and cursor. Records that can't be read are skipped and
  counted rather than failing the call. When `restart` comes back true the
  client sends the file again from its first record, with the new cursor.
  Session-only (see permissions.ts).
  """
  importChunk(
    source: ImportSource!
    "At most 5000 per call, each at most 64 KiB."
    records: [String!]!
    cursor: String
    "Where the history goes. First call only, and not for BUNDLE."
    target: ImportTarget
    "No records follow these."
    done: Boolean
  ): ImportChunk!
}

extend schema {
  mutation: Mutation
}

"""
The signed-in user, as far as a client needs to know them.

Every "day" the API speaks of — `categorySummary.day`, and the `from`/`to` of
each summary query — is a calendar day in `effectiveTimeZone`.
"""
type Me {
  id: String!
  "The account's email — what `deleteAccount` asks to have retyped."
  email: String!
  "The IANA zone chosen with `setTimeZone`, or null to follow the server's."
  timeZone: String
  "The zone this user's days split in: `timeZone`, or the server's own when that is null."
  effectiveTimeZone: String!
  "Days of raw pings and activities chosen with `setRetention`, or null to follow the server's."
  retentionDays: Int
  "Days of raw pings and activities actually kept: the shorter of `retentionDays` and the server's, or null for forever. Summaries are kept regardless."
  effectiveRetentionDays: Int
  "Whether the getting-started checklist was put away with `setOnboarding`."
  onboardingDismissed: Boolean!
  "Whether the checklist's privacy-lists step was ticked with `setOnboarding` — the lists themselves live in each agent's config, out of the server's sight."
  privacyReviewed: Boolean!
  "Whether this account runs the instance: it may pair an OIDC provider. The first account is."
  isAdmin: Boolean!
}

"Where the instance's OIDC provider comes from."
enum SsoSource {
  "OIDC_ISSUER in the server's environment. Read-only from the dashboard."
  ENV
  "Paired from a setup URL."
  PAIRED
  "There is none."
  NONE
}

"How sign-in through an OIDC provider is set up, and whether the caller may change it."
type SsoSetup {
  source: SsoSource!
  "What the sign-in button calls the provider; null when there is none."
  name: String
  "Where the sign-in button sends the browser; null when there is no provider."
  signInUrl: String
  "The provider's issuer URL. Only for a caller who may pair."
  issuer: String
  "Whether the caller may pair a provider, or disconnect the paired one."
  canPair: Boolean!
  "The redirect URI to register with a provider by hand, for an OIDC_ISSUER setup."
  redirectUri: String!
}

# Session payload for signUp/signIn: the raw token goes back as
# `Authorization: Bearer <token>` on every later request (bearer plugin).
type AuthSession {
  token: String!
  userId: String!
}

# `token` is populated only under UNSAFE_LOCAL_NETWORK, letting clients on a
# trusted LAN sign in without an inbox.
type MagicLinkRequest {
  ok: Boolean!
  token: String
}

# The API key is returned exactly once, here.
type DeviceRegistration {
  device: Devices!
  apiKey: String!
}

"""
What `deleteRange` removed.
"""
type RangeDeletion {
  "Devices the range was deleted from."
  devices: Int!
  "Raw pings deleted."
  pings: Int!
  "Calendar days entirely inside the range; their summaries are gone outright."
  days: Int!
  """
  Days (`YYYY-MM-DD`, in the caller's time zone) the range only partly covers
  that still hold time with no raw record left to split — pruned past retention,
  or imported as daily totals. Their totals may still include some of the range.
  """
  partialDays: [String!]!
}

"What `purgeApp` removed."
type AppPurge {
  pings: Int!
  activities: Int!
  summaries: Int!
}

"""
What a replay rebuilt: where it restarted the fold (null when the device's log
had nothing to replay), how many pings it folded, and how many activities it
wrote. Activity ids from before the replay no longer exist.
"""
type DeviceReplay {
  from: String
  pings: Int!
  activities: Int!
}

"""
An integration key, as it can be listed after the fact — everything about the
key except the key. Send it as `x-api-key` to `/graphql` or `/mcp`.
"""
type ApiKey {
  id: String!
  name: String!
  "The key's first few characters, so two of them can be told apart in a list."
  start: String
  createdAt: String!
  "When the key last authenticated a request; null until it is first used."
  lastUsedAt: String
  "Null means the key does not expire."
  expiresAt: String
  enabled: Boolean!
  "What the key may do beyond reading, chosen when it was made."
  scopes: [ApiKeyScope!]!
}

"What an integration key may do beyond reading. Fixed when the key is made."
enum ApiKeyScope {
  """
  Over `/mcp`, the categorization write tools: create categories and category
  rules, assign entries and activities, and re-apply rules. Without it a key
  sees only read tools there.
  """
  CATEGORIZE
}

# The secret is returned exactly once, here — the server keeps only a hash.
type ApiKeyIssued {
  key: ApiKey!
  token: String!
}

"""
A stateless report of what a device looked like at one instant.
"""
input PingInput {
  capturedAt: String!
  app: String
  title: String
  # Agent-supplied sub-app division (browser hostname). When absent, the user's
  # context rules extract one from the title instead.
  context: String
  idleSeconds: Int!
}

"""
A curated, versioned set of exact-match category rules for well-known apps and
sites. The lists are what the rules match, as the agents report them: desktop
executable names and Android launcher labels (`apps`), Android package names
(`packages`), and browser hostnames (`sites`).
"""
type RulePack {
  id: String!
  name: String!
  description: String!
  version: Int!
  "The category the rules fill, created on install unless the caller has one of this name."
  categoryName: String!
  "The kind a category the install creates gets. A reused category keeps its own."
  categoryKind: CategoriesKindEnum!
  apps: [String!]!
  packages: [String!]!
  sites: [String!]!
  "The newest version of this pack whose rules the caller still has, or null when none."
  installedVersion: Int
}

type RulePackInstall {
  pack: RulePack!
  categoryId: String!
  "Rules written that weren't there before."
  added: Int!
  "Rules rewritten from an older version of the pack."
  updated: Int!
  "Activities the follow-up sweep moved to a different category."
  categorized: Int!
}

# Active seconds per category per day, days in the caller's zone
# (`me.effectiveTimeZone`). A null category is uncategorized time.
type CategoryDaySummary {
  day: String!
  categoryId: String
  name: String
  color: String
  "The category's kind; null for uncategorized time."
  kind: CategoriesKindEnum
  seconds: Float!
}

# Active seconds per app, per context within it, and per category, over a
# range. A null context is the app's time with no finer division; a null
# category is uncategorized time.
#
# An app's time can fall in several categories, so an app appears once per
# category it spent time in rather than being forced to one.
type AppContextSummary {
  app: String!
  context: String
  categoryId: String
  categoryName: String
  categoryColor: String
  seconds: Float!
}

"What `accountExport` writes."
enum ExportFormat {
  """
  Everything the account holds, as JSON Lines (`.jsonl`): a
  `{"format":"eunomia-export","version":1}` header, then one record per line
  tagged with `type` — profile, device, category, categoryRule, contextRule,
  mergeRule, summary, activity, focusSegment, ping — and a closing `end` record
  with the counts. Never includes API keys, sessions or other credentials.
  Always the whole account: takes no date range.
  """
  BUNDLE
  """
  The raw ping log as an ActivityWatch export (aw-server's `/api/0/export`
  JSON): an `aw-watcher-window_<device>` and an `aw-watcher-afk_<device>` bucket
  per device, importable from ActivityWatch's Import page.
  """
  ACTIVITYWATCH
  "Daily totals as CSV: `day,device,category,app,context,seconds`."
  SUMMARIES_CSV
}

"What `importChunk` reads."
enum ImportSource {
  """
  An account bundle from `accountExport(format: BUNDLE)`, one JSON line per
  record. Restores the time zone (unless the caller has one), categories and
  rules (matched to existing ones), and each device as a new device without
  keys; activities are rebuilt from the ping log, and summaries are kept only
  for days the log doesn't reach. Read twice — see `ImportChunk.restart`.
  """
  BUNDLE
  """
  ActivityWatch history: the client sends a `{"format":"activitywatch","afk":…}`
  header, then the events of the window, AFK and web buckets it read from
  aw-server's export as `{"type","timestamp","duration","data"}` records, sorted
  by timestamp across buckets. Folded as pings into the target device.
  """
  ACTIVITYWATCH
  """
  A RescueTime Analytic Data export as CSV records, header first (Date, Time
  Spent, Activity and optionally Document columns). Added to the target device
  as daily totals — the file has no order within its intervals to rebuild
  activities from.
  """
  RESCUETIME
}

"Where a single-device import writes: an existing device, or a new one."
input ImportTarget {
  "One of the caller's devices."
  deviceId: String
  "Or a device to create with this name…"
  newDeviceName: String
  "…on this platform: windows, macos, linux or android."
  platform: String
}

"What one `importChunk` call did."
type ImportChunk {
  "Pass as `cursor` with the next records; null once the import is complete."
  next: String
  "Records applied (or already present)."
  accepted: Int!
  "Records passed over; `warnings` says why."
  skipped: Int!
  "Pings folded by this call."
  pings: Int!
  "Send the file again from its first record, with `next` as the cursor."
  restart: Boolean!
  "The devices the import has written into."
  deviceIds: [String!]!
  "Why records were skipped, one line per reason."
  warnings: [String!]!
}

"One piece of an export file."
type ExportChunk {
  "The next part of the file, to append to the parts before it."
  data: String!
  "Rows read for this chunk — for a progress count, not a count of lines."
  rows: Int!
  "Pass as `cursor` to get the next chunk; null when the file is complete."
  next: String
}

# Active seconds per device over a range: the "split by device" view, and the
# picker's source for which devices actually contributed time.
type DeviceSummary {
  deviceId: String!
  name: String!
  platform: String!
  seconds: Float!
}

"One day, as `daySummary` reports it."
type DaySummary {
  "`YYYY-MM-DD` in the caller's time zone."
  day: String!
  totalSeconds: Float!
  uncategorizedSeconds: Float!
  "Time per category, largest first; uncategorized is the row with a null categoryId."
  categories: [CategoryDaySummary!]!
  "The biggest app/context entries, largest first."
  top: [AppContextSummary!]!
  devices: [DeviceSummary!]!
}

"A stored activity that `searchActivity` matched."
type ActivityMatch {
  id: String!
  app: String!
  context: String
  "The most recent window title seen while it was active."
  title: String
  startedAt: String!
  lastActiveAt: String!
  activeSeconds: Float!
  deviceId: String!
  deviceName: String!
  categoryId: String
  categoryName: String
}

"What `previewCategoryRule` found."
type CategoryRulePreview {
  "Seconds of stored activity the patterns match."
  matchedSeconds: Float!
  "Of those, seconds a rule would move: not assigned by hand (rules never touch those)."
  changeableSeconds: Float!
  "Matching activities, as entries, largest first (at most 50)."
  entries: [CategoryRulePreviewEntry!]!
}

type CategoryRulePreviewEntry {
  app: String!
  context: String
  seconds: Float!
