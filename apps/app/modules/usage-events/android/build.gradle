// Local expo module: autolinked from apps/app/modules by expo-modules-core,
// so it needs no entry in app.json and no publishing. The gradle plugin comes
// from expo-modules-core's included build (same one expo's own modules use).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.cubicecho.eunomia'
version = '0.1.0'

android {
  namespace 'expo.modules.usageevents'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The keep-alive service runs the sync as a headless JS task, so it needs
  // React Native's own classes. compileOnly — the app already ships them.
  compileOnly 'com.facebook.react:react-android'
}
